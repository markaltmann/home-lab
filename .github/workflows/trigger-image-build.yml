name: Check External References
on:
  workflow_dispatch: # Manuelles Auslösen
  schedule:
    - cron: "0 7 * * *" # Täglich um 7 Uhr UTC

permissions:
  contents: read

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Erforderlich zum Pushen von Änderungen
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest upstream versions and commit hashes
        id: refs
        run: |
          resolve_ref() {
            local repo="$1"
            local tag
            local sha
            tag=$(git ls-remote --tags "$repo" | awk -F/ '{print $3}' | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
            sha=$(git ls-remote --tags "$repo" "refs/tags/${tag}" "refs/tags/${tag}^{}" | tail -n1 | awk '{print $1}')
            echo "$tag $sha"
          }

          read -r bouncer_tag bouncer_sha < <(resolve_ref "https://github.com/hslatman/caddy-crowdsec-bouncer.git")
          read -r inwx_tag inwx_sha < <(resolve_ref "https://github.com/caddy-dns/inwx.git")
          read -r caddy_tag caddy_sha < <(resolve_ref "https://github.com/caddyserver/caddy.git")

          echo "bouncer-tag=$bouncer_tag" >> $GITHUB_OUTPUT
          echo "bouncer-sha=$bouncer_sha" >> $GITHUB_OUTPUT
          echo "inwx-tag=$inwx_tag" >> $GITHUB_OUTPUT
          echo "inwx-sha=$inwx_sha" >> $GITHUB_OUTPUT
          echo "caddy-tag=$caddy_tag" >> $GITHUB_OUTPUT
          echo "caddy-sha=$caddy_sha" >> $GITHUB_OUTPUT

      - name: Update refs.txt
        id: update
        run: |
          file="refs.txt"
          printf '# References for build (tags and immutable commit hashes).\n' > "$file"
          printf 'caddy=%s\n' "${{ steps.refs.outputs.caddy-tag }}" >> "$file"
          printf 'caddy-commit=%s\n' "${{ steps.refs.outputs.caddy-sha }}" >> "$file"
          printf 'caddy-crowdsec-bouncer=%s\n' "${{ steps.refs.outputs.bouncer-tag }}" >> "$file"
          printf 'caddy-crowdsec-bouncer-commit=%s\n' "${{ steps.refs.outputs.bouncer-sha }}" >> "$file"
          printf 'caddy-dns-inwx=%s\n' "${{ steps.refs.outputs.inwx-tag }}" >> "$file"
          printf 'caddy-dns-inwx-commit=%s\n' "${{ steps.refs.outputs.inwx-sha }}" >> "$file"

      - name: Commit and push refs.txt
        run: |
          git config --global user.email "bot@altmann.it"
          git config --global user.name "GitHub Actions Bot"
          git add refs.txt
          if ! git diff --cached --exit-code; then
            git commit -m "Update external references"
            git push
          else
            echo "No changes to refs.txt, skipping commit."
          fi
