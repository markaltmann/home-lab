name: Dependabot Auto-merge

on:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Enable auto-merge for open Dependabot pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PR_NUMBERS="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,author --jq '.[] | select(.author.login | startswith("dependabot")) | .number' || true)"
          if [ -z "$PR_NUMBERS" ]; then
            echo "No open Dependabot pull requests found."
            exit 0
          fi
          for pr in $PR_NUMBERS; do
            echo "Enabling auto-merge for PR #${pr}"
            gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash || echo "Skipping PR #${pr}: not mergeable/auto-merge not available"
          done
